<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Adventure 文法冒險</title><style>
:root{--p:#3d7cff;--good:#269c61;--bad:#d95656}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(#eaf7ff,#fff);color:#17324d}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;margin:18px 0;box-shadow:0 10px 30px #2659871f}.hero{text-align:center}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px}.btn,.choice{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;cursor:pointer}.btn{background:#eaf1f8}.primary{background:var(--p);color:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;border:2px solid #dfe9f1}.question{text-align:center;font-size:26px;font-weight:900;line-height:1.65;margin:22px 0}.mini{color:#6f8497}.pill{display:inline-block;background:#edf4ff;border-radius:999px;padding:8px 12px;font-weight:800}.progress{height:14px;background:#e7eef5;border-radius:999px;overflow:hidden}.progress div{height:100%;background:var(--p)}.hidden{display:none!important}.good{color:var(--good)}.bad{color:var(--bad)}.feedback{text-align:center;font-size:19px;font-weight:800;min-height:32px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;border:2px solid #dbe7f0;border-radius:14px;padding:13px;font-size:17px}.level{border-left:6px solid var(--p)}@media(max-width:600px){.choices{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><div style="font-size:50px">📝🚀</div><h1>Grammar Adventure</h1><p>Unit 1 人物｜people：Be 動詞・主詞・否定句</p></div>
<div id="login" class="card"><h2>🎒 輸入班級代碼</h2><div class="row"><input id="classCode" placeholder="例如：承裕"><button class="btn primary" onclick="loadClass()">開始</button></div><div id="loginMsg" class="feedback"></div></div>
<div id="menu" class="hidden"><div class="card"><span class="pill" id="unitLabel"></span><h2>選擇文法關卡</h2><p class="mini">使用 Unit 1「人物｜people」單字練習 Be 動詞、主詞與否定句。主詞關卡包含 I / you / he / she / we / they。</p><div class="row"><button class="btn primary" onclick="startLevel('be')">🌱 Level 1：Be 動詞</button><button class="btn primary" onclick="startLevel('subject')">🐣 Level 2：主詞</button><button class="btn primary" onclick="startLevel('negative')">🦜 Level 3：否定句</button><button class="btn primary" onclick="startLevel('boss')">👑 Boss：綜合挑戰</button></div></div><div class="card level"><h3>📌 今天的規則</h3><p><b>I → am</b><br><b>He / She → is</b><br><b>You / We / They → are</b><br><br><b>I am not ...</b><br><b>He / She isn't ...</b><br><b>You / We / They aren't ...</b></p></div></div>
<div id="game" class="hidden"><div class="row" style="justify-content:space-between"><span class="pill">⭐ <span id="score">0</span></span><span class="pill"><span id="no">1</span>/<span id="total">10</span></span></div><div class="progress"><div id="bar"></div></div><div class="card"><div id="kind" class="mini"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></div></div>
<div id="result" class="card hidden" style="text-align:center"><div style="font-size:70px">🏆</div><h1>完成文法挑戰！</h1><h2>⭐ <span id="finalScore"></span></h2><p id="finalText"></p><button class="btn primary" onclick="showMenu()">選擇其他關卡</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://njwcvpyffgkolrymfhtj.supabase.co','sb_publishable_gCTPQ_u_zffvjjhfj-pTEA_jj3tabD1');
let unit=null,questions=[],qi=0,score=0;
const singular=['adult','angel','baby','boy','child','customer','foreigner','gentleman','giant','girl','guy','kid','king','lady','man','neighbor','person','prince','princess','queen','stranger','teenager','woman'];
function sh(a){return [...a].sort(()=>Math.random()-.5)}
async function loadClass(){const code=document.getElementById('classCode').value.trim(),m=document.getElementById('loginMsg');if(!code){m.textContent='請輸入班級代碼';return}m.textContent='載入中…';const {data,error}=await db.rpc('get_class_content',{p_class_code:code});if(error||!data){m.className='feedback bad';m.textContent='找不到此班級';return}unit=(data.units||[]).find(u=>/unit\s*1/i.test(u.name)&&(/people/i.test(u.name)||/人物/.test(u.name)))||(data.units||[])[0];if(!unit||!unit.words?.length){m.className='feedback bad';m.textContent='找不到 Unit 1 單字';return}document.getElementById('unitLabel').textContent='📚 '+unit.name+'｜'+unit.words.length+' 個單字';document.getElementById('login').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
function makeSubjectQuestions(){
 const candidates=sh(singular).slice(0,8),w=i=>candidates[i%candidates.length];
 return sh([
  {k:'主詞 I / you / he / she / we / they',q:`My name is Ben. I am a ${w(0)}. ___ am happy to meet you.`,a:'I',o:['I','He','We','They'],why:'前一句的人正在介紹自己，而且空格後面是 am，所以主詞是 I。'},
  {k:'主詞 I / you / he / she / we / they',q:`Amy is a ${w(1)}. ___ is my good friend.`,a:'She',o:['She','He','We','They'],why:'Amy 是一位女生，下一句用 She 代替 Amy；She 要搭配 is。'},
  {k:'主詞 I / you / he / she / we / they',q:`Jack is a ${w(2)}. ___ is waiting for the bus.`,a:'He',o:['He','She','We','I'],why:'Jack 是一位男生，下一句用 He 代替 Jack；He 要搭配 is。'},
  {k:'主詞 I / you / he / she / we / they',q:`Tom and Amy are ${w(3)}s. ___ are in the classroom now.`,a:'They',o:['They','We','He','She'],why:'Tom and Amy 是兩個人，說話者不包含在其中，所以使用 They。'},
  {k:'主詞 I / you / he / she / we / they',q:`Kevin and I are ${w(4)}s. ___ are good friends.`,a:'We',o:['We','They','He','I'],why:'Kevin and I 包含「我」，兩人合在一起要使用 We。'},
  {k:'主詞 I / you / he / she / we / they',q:`“Are ___ a ${w(5)}?” the woman asks you.`,a:'you',o:['you','I','he','they'],why:'這句話是直接問「你」，所以使用 you；you 要搭配 are。'},
  {k:'主詞 I / you / he / she / we / they',q:`Lisa is my new ${w(6)}. ___ is very nice to everyone.`,a:'She',o:['She','He','They','We'],why:'Lisa 是女生姓名，因此第二句用 She。人物單字本身不決定性別。'},
  {k:'主詞 I / you / he / she / we / they',q:`David is a ${w(7)}. ___ is talking to the customer.`,a:'He',o:['He','She','They','I'],why:'David 是男生姓名，因此第二句用 He。人物單字本身不決定性別。'},
  {k:'主詞 I / you / he / she / we / they',q:'My sister and I are teenagers. ___ are students at the same school.',a:'We',o:['We','They','She','I'],why:'My sister and I 包含說話者自己，所以使用 We；We 要搭配 are。'},
  {k:'主詞 I / you / he / she / we / they',q:'The two children are my neighbors. ___ are playing in the park.',a:'They',o:['They','We','He','She'],why:'The two children 是複數，而且不包含說話者，所以使用 They；They 要搭配 are。'}
 ])
}
function make(type){if(type==='subject')return makeSubjectQuestions();const pool=sh(singular).slice(0,10);return pool.map((en,i)=>{const p=i%2?'He':'She',art=/^[aeiou]/i.test(en)?'an':'a';if(type==='be'){const mode=i%3;if(mode===0)return{k:'Be 動詞',q:`I ___ ${art} ${en}.`,a:'am',o:['am','is','are'],why:'I 要搭配 am。'};if(mode===1)return{k:'Be 動詞',q:`${p} ___ ${art} ${en}.`,a:'is',o:['am','is','are'],why:`${p} 要搭配 is。`};return{k:'Be 動詞',q:`They ___ ${en}s.`,a:'are',o:['am','is','are'],why:'They 是複數主詞，要搭配 are。'}}if(type==='negative'){const mode=i%3;if(mode===0)return{k:'否定句',q:`I ___ ${art} ${en}.`,a:'am not',o:['am not',"isn't","aren't"],why:'I 的 Be 動詞否定句使用 am not。'};if(mode===1)return{k:'否定句',q:`${p} ___ ${art} ${en}.`,a:"isn't",o:["isn't","am not","aren't"],why:`${p} → is；否定形式是 isn't。`};return{k:'否定句',q:`They ___ ${en}s.`,a:"aren't",o:["aren't","isn't",'am not'],why:`They → are；否定形式是 aren't。`}}const modes=['be','subject','negative'];return make(modes[i%3])[i%10]})}
function startLevel(type){questions=make(type);qi=0;score=0;document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){const x=questions[qi];document.getElementById('score').textContent=score;document.getElementById('no').textContent=qi+1;document.getElementById('total').textContent=questions.length;document.getElementById('bar').style.width=(qi/questions.length*100)+'%';document.getElementById('kind').textContent=x.k;document.getElementById('question').textContent=x.q;document.getElementById('feedback').textContent='';const c=document.getElementById('choices');c.innerHTML='';sh(x.o).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answer(o,x);c.appendChild(b)})}
function answer(o,x){document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);const f=document.getElementById('feedback');if(o===x.a){score+=10;f.className='feedback good';f.textContent='✅ 答對了！ '+x.why}else{f.className='feedback bad';f.textContent='❌ 正確答案：'+x.a+'。 '+x.why}setTimeout(()=>{qi++;if(qi<questions.length)render();else finish()},1500)}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=score+' / '+questions.length*10;document.getElementById('finalText').textContent=score>=80?'太棒了！你已經掌握今天的文法！':'再挑戰一次，記得 I→am、He/She→is、You/We/They→are！'}function showMenu(){document.getElementById('result').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
</script></body></html>
