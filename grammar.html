<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Adventure 文法大冒險</title><style>
:root{--p:#3d7cff;--good:#269d64;--bad:#d95656;--text:#17324d;--muted:#6f8497}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(#eef8ff,#f9fcff);color:var(--text)}.wrap{max-width:900px;margin:auto;padding:20px}.hero{text-align:center;padding:22px}.card{background:#fff;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 10px 30px #2659871f}.btn,.choice{border:0;border-radius:16px;padding:14px 18px;font-weight:800;cursor:pointer}.btn{background:#eaf1f8}.primary{background:var(--p);color:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;border:2px solid #dfe9f1;font-size:18px}.topics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.topic{padding:18px;border:2px solid #dfe9f1;border-radius:18px;background:#fff;text-align:left;font-weight:900;cursor:pointer}.question{font-size:27px;font-weight:900;text-align:center;line-height:1.5;margin:22px 0}.zh{text-align:center;color:var(--muted);font-size:16px}.feedback{text-align:center;min-height:58px;font-size:18px;font-weight:800;line-height:1.5;margin-top:12px}.good{color:var(--good)}.bad{color:var(--bad)}.pill{display:inline-block;background:#edf4ff;border-radius:999px;padding:8px 12px;font-weight:800}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.progress{height:12px;background:#e7eef5;border-radius:99px;overflow:hidden}.progress div{height:100%;background:var(--p)}input{width:100%;padding:13px;border:2px solid #dbe7f0;border-radius:14px;font:inherit}.row{display:flex;gap:10px}.wordbank{font-size:14px;color:var(--muted);line-height:1.8}@media(max-width:650px){.choices,.topics{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head><body><div class="wrap"><div class="hero"><div style="font-size:50px">📝🚀</div><h1>Grammar Adventure</h1><p>Unit 1 人物｜用 26 個人物單字學文法</p></div>
<section id="login" class="card"><h2>🎒 載入班級</h2><p>輸入老師提供的班級名稱／代碼。</p><div class="row"><input id="code" placeholder="例如：承裕"><button class="btn primary" onclick="loadClass()">載入</button></div><div id="status" class="feedback"></div></section>
<section id="menu" class="hidden"><div class="card"><div class="top"><div><h2 id="classTitle">文法練習</h2><span class="pill" id="unitInfo"></span></div><button class="btn" onclick="location.href='./'">回單字大冒險</button></div><p>每個主題 10 題；題目會盡量輪流使用 Unit 1 的 26 個人物單字。</p><div class="topics">
<button class="topic" onclick="startTopic('be')">① Be 動詞<br><small>am / is / are</small></button><button class="topic" onclick="startTopic('subject')">② 主詞<br><small>I / you / he / she / it / we / they</small></button><button class="topic" onclick="startTopic('poss')">③ 所有格<br><small>my / your / his / her / our / their</small></button><button class="topic" onclick="startTopic('beneg')">④ Be 動詞否定句<br><small>am not / isn't / aren't</small></button><button class="topic" onclick="startTopic('donneg')">⑤ 一般動詞否定句<br><small>don't / doesn't</small></button><button class="topic" onclick="startTopic('mix')">👾 綜合 Boss<br><small>六種文法混合挑戰</small></button></div></div><div class="card"><h3>📚 本次人物單字</h3><div id="wordbank" class="wordbank"></div></div></section>
<section id="game" class="hidden"><div class="top"><button class="btn" onclick="showMenu()">← 文法選單</button><span class="pill">⭐ <span id="score">0</span></span><span class="pill"><span id="no">1</span>/10</span></div><div class="progress"><div id="bar"></div></div><div class="card"><div id="topicName" class="pill"></div><div id="q" class="question"></div><div id="qzh" class="zh"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></div></section>
<section id="done" class="card hidden" style="text-align:center"><div style="font-size:64px">🏆</div><h1>完成文法挑戰！</h1><h2 id="final"></h2><button class="btn primary" onclick="showMenu()">挑戰其他文法</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://njwcvpyffgkolrymfhtj.supabase.co','sb_publishable_gCTPQ_u_zffvjjhfj-pTEA_jj3tabD1');
let words=[],questions=[],qi=0,score=0,current='';const female=new Set(['girl','lady','woman','princess','queen']);const male=new Set(['boy','gentleman','guy','king','man','prince']);
const topicNames={be:'Be 動詞 am / is / are',subject:'主詞',poss:'所有格',beneg:'Be 動詞否定句',donneg:'一般動詞否定句',mix:'綜合 Boss'};
const sh=a=>[...a].sort(()=>Math.random()-.5);function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadClass(){let code=document.getElementById('code').value.trim(),st=document.getElementById('status');if(!code){st.textContent='請輸入班級名稱／代碼。';return}st.textContent='☁️ 正在載入…';let {data,error}=await db.rpc('get_class_content',{p_class_code:code});if(error||!data){st.className='feedback bad';st.textContent='找不到這個班級。';return}let u=(data.units||[]).find(x=>/unit\s*1/i.test(x.name)&&(/people|人物/i.test(x.name)||x.words?.length===26))||(data.units||[]).find(x=>x.words?.length===26);if(!u){st.className='feedback bad';st.textContent='找不到 Unit 1 人物（26 個單字）。';return}words=(u.words||[]).map(x=>({en:x.en,zh:x.zh}));document.getElementById('classTitle').textContent='☁️ '+data.class_name+'｜文法練習';document.getElementById('unitInfo').textContent=u.name+'｜'+words.length+' 個單字';document.getElementById('wordbank').textContent=words.map(x=>x.en+'（'+x.zh+'）').join('、');document.getElementById('login').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
function pronoun(w){if(female.has(w.en))return 'She';if(male.has(w.en))return 'He';return 'It'}function poss(w){let p=pronoun(w);return p==='She'?'her':p==='He'?'his':'its'}
function make(w,type,i){let p=pronoun(w),a=[];if(type==='be')return {q:'The '+w.en+' ___ here.',zh:w.zh+'在這裡。',a:'is',o:['is','are','am','be'],why:'The '+w.en+' 是單數第三人稱，所以使用 is。'};
if(type==='subject')return {q:'The '+w.en+' is here. ___ is ready.',zh:'「'+w.zh+'」在這裡。下一句應使用哪個主詞？',a:p,o:sh([p,'They','We','I']).filter((x,j,z)=>z.indexOf(x)===j).slice(0,4),why:w.en+' 是單數人物，這裡使用 '+p+'。'};
if(type==='poss'){let a=poss(w);return {q:'This is the '+w.en+". It is ___ bag.",zh:'這是「'+w.zh+'」。這是他／她的包包。',a:a,o:sh([a,'my','our','their']).filter((x,j,z)=>z.indexOf(x)===j).slice(0,4),why:p+' 對應的所有格是 '+a+'。'}}
if(type==='beneg')return {q:'The '+w.en+' is not tired. The '+w.en+' ___ tired.',zh:'把 is not 改成縮寫。',a:"isn't",o:["isn't","aren't","don't","doesn't"],why:'is not 的縮寫是 isn’t。'};
if(type==='donneg')return {q:'The '+w.en+' ___ like coffee.',zh:'「'+w.zh+'」不喜歡咖啡。',a:"doesn't",o:["doesn't","don't","isn't","aren't"],why:'單數第三人稱的一般動詞否定句使用 doesn’t + 原形動詞。'};
let types=['be','subject','poss','beneg','donneg'];return make(w,types[i%types.length],i)}
function startTopic(t){current=t;score=0;qi=0;let pool=sh(words);questions=Array.from({length:10},(_,i)=>make(pool[i%pool.length],t,i));document.getElementById('menu').classList.add('hidden');document.getElementById('done').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){let x=questions[qi];document.getElementById('topicName').textContent=topicNames[current];document.getElementById('no').textContent=qi+1;document.getElementById('score').textContent=score;document.getElementById('bar').style.width=(qi/10*100)+'%';document.getElementById('q').textContent=x.q;document.getElementById('qzh').textContent=x.zh;document.getElementById('feedback').textContent='';let box=document.getElementById('choices');box.innerHTML='';sh(x.o).forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answer(o,x);box.appendChild(b)})}
function answer(o,x){document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);let f=document.getElementById('feedback'),ok=o===x.a;if(ok){score+=10;f.className='feedback good';f.textContent='🎉 答對了！ '+x.why}else{f.className='feedback bad';f.innerHTML='❌ 正確答案：<b>'+esc(x.a)+'</b><br>'+esc(x.why)}setTimeout(()=>{qi++;if(qi<10)render();else finish()},ok?900:1800)}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('final').textContent=topicNames[current]+'：'+score+' / 100 ⭐'}function showMenu(){document.getElementById('game').classList.add('hidden');document.getElementById('done').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
</script></body></html>
