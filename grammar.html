<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Adventure 文法冒險</title><style>
:root{--p:#3d7cff;--good:#269c61;--bad:#d95656}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(#eaf7ff,#fff);color:#17324d}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border-radius:24px;padding:22px;margin:18px 0;box-shadow:0 10px 30px #2659871f}.hero{text-align:center}.hero h1{font-size:clamp(34px,7vw,58px);margin:8px}.btn,.choice{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;cursor:pointer}.btn{background:#eaf1f8}.primary{background:var(--p);color:#fff}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;border:2px solid #dfe9f1}.question{text-align:center;font-size:28px;font-weight:900;margin:22px 0}.mini{color:#6f8497}.pill{display:inline-block;background:#edf4ff;border-radius:999px;padding:8px 12px;font-weight:800}.progress{height:14px;background:#e7eef5;border-radius:999px;overflow:hidden}.progress div{height:100%;background:var(--p)}.hidden{display:none!important}.good{color:var(--good)}.bad{color:var(--bad)}.feedback{text-align:center;font-size:19px;font-weight:800;min-height:32px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}input{flex:1;min-width:180px;border:2px solid #dbe7f0;border-radius:14px;padding:13px;font-size:17px}.level{border-left:6px solid var(--p)}@media(max-width:600px){.choices{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><div style="font-size:50px">📝🚀</div><h1>Grammar Adventure</h1><p>Unit 1 人物｜people：Be 動詞・主詞・否定句</p></div>
<div id="login" class="card"><h2>🎒 輸入班級代碼</h2><div class="row"><input id="classCode" placeholder="例如：承裕"><button class="btn primary" onclick="loadClass()">開始</button></div><div id="loginMsg" class="feedback"></div></div>
<div id="menu" class="hidden"><div class="card"><span class="pill" id="unitLabel"></span><h2>選擇文法關卡</h2><p class="mini">使用 Unit 1「人物｜people」單字，先練 I / He / She，再挑戰否定句。</p><div class="row"><button class="btn primary" onclick="startLevel('be')">🌱 Level 1：Be 動詞</button><button class="btn primary" onclick="startLevel('subject')">🐣 Level 2：主詞</button><button class="btn primary" onclick="startLevel('negative')">🦜 Level 3：否定句</button><button class="btn primary" onclick="startLevel('boss')">👑 Boss：綜合挑戰</button></div></div><div class="card level"><h3>📌 今天的規則</h3><p><b>I → am</b><br><b>He / She → is</b><br><b>I am not ...</b><br><b>He / She isn't ...</b></p></div></div>
<div id="game" class="hidden"><div class="row" style="justify-content:space-between"><span class="pill">⭐ <span id="score">0</span></span><span class="pill"><span id="no">1</span>/<span id="total">10</span></span></div><div class="progress"><div id="bar"></div></div><div class="card"><div id="kind" class="mini"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div></div></div>
<div id="result" class="card hidden" style="text-align:center"><div style="font-size:70px">🏆</div><h1>完成文法挑戰！</h1><h2>⭐ <span id="finalScore"></span></h2><p id="finalText"></p><button class="btn primary" onclick="showMenu()">選擇其他關卡</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://njwcvpyffgkolrymfhtj.supabase.co','sb_publishable_gCTPQ_u_zffvjjhfj-pTEA_jj3tabD1');
let unit=null,questions=[],qi=0,score=0;
const singular=['adult','angel','baby','boy','child','customer','foreigner','gentleman','giant','girl','guy','kid','king','lady','man','neighbor','person','prince','princess','queen','stranger','teenager','woman'];
const male=new Set(['boy','gentleman','guy','king','man','prince']);const female=new Set(['girl','lady','princess','queen','woman']);
function sh(a){return [...a].sort(()=>Math.random()-.5)}
async function loadClass(){const code=document.getElementById('classCode').value.trim(),m=document.getElementById('loginMsg');if(!code){m.textContent='請輸入班級代碼';return}m.textContent='載入中…';const {data,error}=await db.rpc('get_class_content',{p_class_code:code});if(error||!data){m.className='feedback bad';m.textContent='找不到此班級';return}unit=(data.units||[]).find(u=>/unit\s*1/i.test(u.name)&&(/people/i.test(u.name)||/人物/.test(u.name)))||(data.units||[])[0];if(!unit||!unit.words?.length){m.className='feedback bad';m.textContent='找不到 Unit 1 單字';return}document.getElementById('unitLabel').textContent='📚 '+unit.name+'｜'+unit.words.length+' 個單字';document.getElementById('login').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
function wordObj(en){return unit.words.find(w=>(w.en||'').toLowerCase()===en)||{en,zh:en}}
function pronoun(en,i){if(male.has(en))return 'He';if(female.has(en))return 'She';return i%2?'He':'She'}
function make(type){const pool=sh(singular).slice(0,10);return pool.map((en,i)=>{const p=pronoun(en,i),art=/^[aeiou]/i.test(en)?'an':'a';if(type==='be')return {k:'Be 動詞',q:`${p} ___ ${art} ${en}.`,a:'is',o:['am','is','are'],why:`${p} 要搭配 is。`};if(type==='subject')return {k:'主詞 I / He / She',q:`___ is ${art} ${en}.`,a:p,o:['I','He','She'],why:`這個人物使用 ${p}，而 ${p} 要搭配 is。`};if(type==='negative')return {k:'否定句',q:`${p} ___ ${art} ${en}.`,a:"isn't",o:["isn't","am not","aren't"],why:`${p} 的 Be 動詞是 is；否定句是 is not / isn't。`};const mode=i%3;if(mode===0)return {k:'Boss：Be 動詞',q:`${p} ___ ${art} ${en}.`,a:'is',o:['am','is','are'],why:`${p} → is。`};if(mode===1)return {k:'Boss：主詞',q:`___ is ${art} ${en}.`,a:p,o:['I','He','She'],why:`正確主詞是 ${p}。`};return {k:'Boss：否定句',q:`${p} ___ ${art} ${en}.`,a:"isn't",o:["isn't","am not","aren't"],why:`${p} → is → isn't。`}})}
function addI(type,arr){const opts={be:{k:'Be 動詞',q:'I ___ a person.',a:'am',o:['am','is','are'],why:'I 要搭配 am。'},subject:{k:'主詞 I / He / She',q:'___ am a teenager.',a:'I',o:['I','He','She'],why:'只有 I 搭配 am。'},negative:{k:'否定句',q:'I ___ an adult.',a:'am not',o:['am not',"isn't","aren't"],why:'I 的否定句使用 am not。'},boss:{k:'Boss：綜合',q:'I ___ a stranger.',a:'am not',o:['am not',"isn't","aren't"],why:'I → am；否定形式是 am not。'}};arr[0]=opts[type];return arr}
function startLevel(type){questions=addI(type,make(type));qi=0;score=0;document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render()}
function render(){const x=questions[qi];document.getElementById('score').textContent=score;document.getElementById('no').textContent=qi+1;document.getElementById('total').textContent=questions.length;document.getElementById('bar').style.width=(qi/questions.length*100)+'%';document.getElementById('kind').textContent=x.k;document.getElementById('question').textContent=x.q;document.getElementById('feedback').textContent='';const c=document.getElementById('choices');c.innerHTML='';sh(x.o).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answer(o,x);c.appendChild(b)})}
function answer(o,x){document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);const f=document.getElementById('feedback');if(o===x.a){score+=10;f.className='feedback good';f.textContent='✅ 答對了！ '+x.why}else{f.className='feedback bad';f.textContent='❌ 正確答案：'+x.a+'。 '+x.why}setTimeout(()=>{qi++;if(qi<questions.length)render();else finish()},1200)}
function finish(){document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('finalScore').textContent=score+' / '+questions.length*10;document.getElementById('finalText').textContent=score>=80?'太棒了！你已經掌握今天的文法！':'再挑戰一次，把 I → am、He/She → is 記熟喔！'}function showMenu(){document.getElementById('result').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')}
</script></body></html>
