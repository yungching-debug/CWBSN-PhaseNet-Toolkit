<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Word Adventure 單字大冒險</title>
  <style>
    :root{--bg:#f7fbff;--card:#fff;--text:#17324d;--muted:#6f8497;--primary:#3d7cff;--accent:#ffd54a;--good:#3dbb78;--bad:#ff7b7b;--shadow:0 10px 30px rgba(38,89,135,.12)}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#eef8ff 0%,var(--bg) 60%);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:24px}.hero{text-align:center;padding:28px 0 16px}.hero h1{font-size:clamp(34px,7vw,64px);margin:0 0 6px}.hero p{color:var(--muted);margin:0}.card{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin:18px 0}.row{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;background:#eaf1f8;color:var(--text)}.btn.primary{background:var(--primary);color:white}.btn.yellow{background:var(--accent)}.btn.big{font-size:20px;padding:18px 26px}.hidden{display:none!important}.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.role{padding:30px;border:0;border-radius:24px;background:white;box-shadow:var(--shadow);font-size:22px;font-weight:900}.word-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:10px 0}input{width:100%;border:2px solid #dbe7f0;border-radius:14px;padding:13px 14px;background:white;color:var(--text)}.mini{color:var(--muted);font-size:14px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:#edf4ff;border-radius:999px;padding:8px 12px;font-weight:800}.question{text-align:center;font-size:28px;font-weight:900;margin:20px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:2px solid #dfe9f1;border-radius:18px;padding:18px;background:white;font-weight:800;font-size:18px}.feedback{min-height:34px;text-align:center;font-size:20px;font-weight:900;margin-top:14px}.goodtxt{color:var(--good)}.badtxt{color:#d95656}.progress{height:14px;background:#e7eef5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--primary);width:0%}.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.match{min-height:88px;border:0;border-radius:16px;background:#eef5ff;font-weight:900;padding:10px}.match.selected{outline:4px solid var(--accent)}.match.done{visibility:hidden}.result{text-align:center}.result .score{font-size:54px;font-weight:1000}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e7eef4;text-align:left}@media(max-width:650px){.role-grid,.choices{grid-template-columns:1fr}.word-row{grid-template-columns:1fr 1fr}.word-row button{grid-column:1/-1}.match-grid{grid-template-columns:repeat(2,1fr)}}
  
.modal{position:fixed;inset:0;background:rgba(23,50,77,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal-box{background:white;border-radius:24px;padding:26px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.2);text-align:center;animation:pop .22s ease-out}
.modal-box h3{font-size:28px;margin:0 0 10px}.modal-box p{font-size:20px;line-height:1.6}.modal-answer{font-size:30px;font-weight:1000;color:#d95656;margin:12px 0}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.game-area{position:relative;height:360px;border-radius:24px;background:linear-gradient(180deg,#dff3ff,#f9fcff);overflow:hidden;border:3px solid #d9e9f6}
.target{position:absolute;border:0;border-radius:22px;padding:16px 20px;background:#fff;box-shadow:0 10px 24px rgba(0,0,0,.14);font-size:22px;font-weight:1000;transition:left .55s ease,top .55s ease,transform .2s}
.target:hover{transform:scale(1.08)}
.game-prompt{text-align:center;font-size:26px;font-weight:1000;margin-bottom:16px}
.spark{position:absolute;font-size:28px;animation:spark .7s ease-out forwards;pointer-events:none}
@keyframes spark{to{transform:translateY(-70px) scale(1.6);opacity:0}}
.skip-btn{margin-left:auto;background:#fff3c4;color:#6d5600;border:2px solid #f0d76b}.skip-wrap{display:flex;justify-content:flex-end;margin:10px 0 14px}</style>
</head>
<body><div class="wrap">
<section id="home"><div class="hero"><div style="font-size:48px">🌎🚀</div><h1>Word Adventure</h1><p>單字大冒險｜把英文單字變成闖關遊戲</p></div><div class="role-grid"><button class="role" onclick="show('teacher')">👩‍🏫<br>我是老師</button><button class="role" onclick="show('student')">🎒<br>我是學生</button></div></section>
<section id="teacher" class="hidden"><div class="topbar"><h2>👩‍🏫 老師模式</h2><button class="btn" onclick="show('home')">回首頁</button></div><div class="card"><h3>建立今天的單字任務</h3><p class="mini">輸入英文與中文意思，至少 4 組。資料會儲存在這台裝置的瀏覽器中。</p><div id="wordList"></div><div class="row"><button class="btn" onclick="addWord()">＋ 新增單字</button><button class="btn primary" onclick="saveWords()">建立今天的冒險 🚀</button></div><p id="saveMsg" class="feedback"></p></div><div class="card"><h3>目前單字庫</h3><div id="teacherTable"></div></div></section>
<section id="student" class="hidden"><div class="topbar"><h2>🎒 學生模式</h2><button class="btn" onclick="show('home')">回首頁</button></div><div class="card result"><div style="font-size:62px">🐣</div><h2>準備開始今天的單字冒險嗎？</h2><p id="wordCountText"></p><button class="btn primary big" onclick="startGame()">開始冒險 🚀</button></div></section>
<section id="quiz" class="hidden"><div class="topbar"><span class="pill">⭐ <span id="score">0</span></span><span class="pill">題目 <span id="qNo">1</span>/<span id="qTotal">10</span></span></div><div class="skip-wrap"><button class="btn skip-btn" onclick="skipStage('quiz')">⏭ 跳過此關</button></div><div class="progress"><div id="bar"></div></div><div class="card"><div class="mini">第一關：選出正確意思</div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></div></section>
<section id="match" class="hidden"><div class="topbar"><h2>🃏 第二關：翻牌配對</h2><span class="pill">配對 <span id="matchDone">0</span>/<span id="matchTotal">0</span></span></div><div class="skip-wrap"><button class="btn skip-btn" onclick="skipStage('match')">⏭ 跳過此關</button></div><div class="card"><p class="mini">依序點兩張卡，找出英文與中文的正確配對。</p><div id="matchGrid" class="match-grid"></div><div id="matchFeedback" class="feedback"></div></div></section>

<section id="animGame" class="hidden">
  <div class="topbar">
    <h2>🎯 第三關：抓住正確單字</h2>
    <span class="pill">⭐ <span id="animScore">0</span></span>
  </div>
  <div class="skip-wrap"><button class="btn skip-btn" onclick="skipStage('animGame')">⏭ 跳過此關</button></div>
  <div class="card">
    <div class="game-prompt" id="animPrompt"></div>
    <div class="game-area" id="gameArea"></div>
    <div class="feedback" id="animFeedback"></div>
  </div>
</section>
<section id="review" class="hidden"><div class="topbar"><h2>🔥 Boss 關：錯題再挑戰</h2><span class="pill">⭐ <span id="reviewScore">0</span></span></div><div class="skip-wrap"><button class="btn skip-btn" onclick="skipStage('review')">⏭ 跳過此關</button></div><div class="card"><div class="question" id="reviewQuestion"></div><div class="choices" id="reviewChoices"></div><div class="feedback" id="reviewFeedback"></div></div></section>
<section id="result" class="hidden"><div class="card result"><div style="font-size:72px">🏆</div><h1>Mission Complete!</h1><div class="score"><span id="finalScore">0</span> ⭐</div><p id="finalText"></p><div class="row" style="justify-content:center"><button class="btn primary" onclick="startGame()">再玩一次</button><button class="btn yellow" onclick="show('home')">回首頁</button></div></div></section>
</div><script>
const defaults=[{en:'hungry',zh:'飢餓的'},{en:'library',zh:'圖書館'},{en:'beautiful',zh:'漂亮的'},{en:'elephant',zh:'大象'},{en:'breakfast',zh:'早餐'},{en:'hospital',zh:'醫院'}];let words=JSON.parse(localStorage.getItem('wordAdventureWords')||'null')||defaults;let quizQuestions=[],qi=0,score=0,wrongWords=[],selectedMatch=null,matched=0,reviewList=[],ri=0,reviewScore=0,modalNext=null,animWords=[],ai=0,animRoundScore=0,moveTimer=null;
function show(id){document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='teacher')renderTeacher();if(id==='student')document.getElementById('wordCountText').textContent=`今天共有 ${words.length} 個單字`}
function addWord(en='',zh=''){const row=document.createElement('div');row.className='word-row';row.innerHTML=`<input placeholder="英文單字" value="${escapeHtml(en)}"><input placeholder="中文意思" value="${escapeHtml(zh)}"><button class="btn" onclick="this.parentElement.remove()">刪除</button>`;document.getElementById('wordList').appendChild(row)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderTeacher(){const list=document.getElementById('wordList');list.innerHTML='';words.forEach(w=>addWord(w.en,w.zh));renderTable()}
function saveWords(){const rows=[...document.querySelectorAll('#wordList .word-row')];const next=rows.map(r=>({en:r.children[0].value.trim(),zh:r.children[1].value.trim()})).filter(w=>w.en&&w.zh);const msg=document.getElementById('saveMsg');if(next.length<4){msg.className='feedback badtxt';msg.textContent='至少需要 4 組完整單字喔！';return}words=next;localStorage.setItem('wordAdventureWords',JSON.stringify(words));msg.className='feedback goodtxt';msg.textContent=`🎉 已建立 ${words.length} 個單字的冒險！`;renderTable()}
function renderTable(){document.getElementById('teacherTable').innerHTML='<table><thead><tr><th>英文</th><th>中文</th></tr></thead><tbody>'+words.map(w=>`<tr><td>${escapeHtml(w.en)}</td><td>${escapeHtml(w.zh)}</td></tr>`).join('')+'</tbody></table>'}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function startGame(){if(words.length<4){alert('請先請老師建立至少 4 個單字。');return}score=0;wrongWords=[];qi=0;quizQuestions=shuffle(words).slice(0,Math.min(10,words.length));document.getElementById('qTotal').textContent=quizQuestions.length;show('quiz');renderQuestion()}
function renderQuestion(){const w=quizQuestions[qi];document.getElementById('qNo').textContent=qi+1;document.getElementById('score').textContent=score;document.getElementById('bar').style.width=(qi/quizQuestions.length*100)+'%';document.getElementById('question').textContent=w.en;document.getElementById('feedback').textContent='';let distract=shuffle(words.filter(x=>x.zh!==w.zh)).slice(0,3).map(x=>x.zh),opts=shuffle([w.zh,...distract]),choices=document.getElementById('choices');choices.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answerQuiz(o===w.zh,w);choices.appendChild(b)})}
function showWrongModal(w,next){
  document.getElementById('wrongModalText').textContent='你剛剛答錯了，正確答案是：';
  document.getElementById('wrongModalAnswer').textContent=w.en+' = '+w.zh;
  modalNext=next;
  document.getElementById('wrongModal').classList.remove('hidden');
}
function closeWrongModal(){
  document.getElementById('wrongModal').classList.add('hidden');
  const next=modalNext; modalNext=null;
  if(next) next();
}
function answerQuiz(ok,w){
  document.querySelectorAll('#choices button').forEach(b=>b.disabled=true);
  const f=document.getElementById('feedback');
  const goNext=()=>{qi++;if(qi<quizQuestions.length)renderQuestion();else startMatch()};
  if(ok){
    score+=10;f.className='feedback goodtxt';f.textContent='🎉 Great! +10 ⭐';
    document.getElementById('score').textContent=score;
    setTimeout(goNext,700);
  }else{
    wrongWords.push(w);f.className='feedback badtxt';f.textContent='這題先記起來，再繼續！';
    showWrongModal(w,goNext);
  }
}
function startMatch(){show('match');let set=shuffle(words).slice(0,Math.min(6,words.length));matched=0;selectedMatch=null;document.getElementById('matchDone').textContent='0';document.getElementById('matchTotal').textContent=set.length;const cards=[];set.forEach((w,i)=>cards.push({id:i,type:'en',text:w.en},{id:i,type:'zh',text:w.zh}));const grid=document.getElementById('matchGrid');grid.innerHTML='';shuffle(cards).forEach(c=>{const b=document.createElement('button');b.className='match';b.textContent=c.text;b.dataset.id=c.id;b.dataset.type=c.type;b.onclick=()=>selectMatch(b);grid.appendChild(b)})}
function selectMatch(btn){if(btn.classList.contains('done')||btn===selectedMatch)return;btn.classList.add('selected');if(!selectedMatch){selectedMatch=btn;return}const first=selectedMatch,second=btn;if(first.dataset.id===second.dataset.id&&first.dataset.type!==second.dataset.type){first.classList.add('done');second.classList.add('done');first.classList.remove('selected');second.classList.remove('selected');selectedMatch=null;matched++;score+=10;document.getElementById('matchDone').textContent=matched;document.getElementById('matchFeedback').textContent='✨ MATCH! +10 ⭐';if(matched===Number(document.getElementById('matchTotal').textContent))setTimeout(startAnimGame,650)}else setTimeout(()=>{first.classList.remove('selected');second.classList.remove('selected');selectedMatch=null},450)}
function startAnimGame(){
  show('animGame');
  animWords=shuffle(words).slice(0,Math.min(5,words.length));
  ai=0;animRoundScore=0;
  document.getElementById('animScore').textContent='0';
  renderAnimRound();
}
function renderAnimRound(){
  clearInterval(moveTimer);
  const w=animWords[ai];
  document.getElementById('animPrompt').textContent='請抓住：「'+w.zh+'」';
  document.getElementById('animFeedback').textContent='';
  const area=document.getElementById('gameArea'); area.innerHTML='';
  let opts=shuffle([w,...shuffle(words.filter(x=>x.en!==w.en)).slice(0,3)]);
  opts.forEach((x,idx)=>{
    const b=document.createElement('button');
    b.className='target'; b.textContent=x.en;
    b.style.left=(8+Math.random()*65)+'%';
    b.style.top=(8+Math.random()*65)+'%';
    b.onclick=()=>answerAnim(x.en===w.en,w,b);
    area.appendChild(b);
  });
  moveTimer=setInterval(()=>{
    [...area.querySelectorAll('.target')].forEach(b=>{
      b.style.left=(5+Math.random()*72)+'%';
      b.style.top=(5+Math.random()*68)+'%';
    });
  },900);
}
function answerAnim(ok,w,btn){
  clearInterval(moveTimer);
  [...document.querySelectorAll('#gameArea .target')].forEach(b=>b.disabled=true);
  const f=document.getElementById('animFeedback');
  const next=()=>{ai++; if(ai<animWords.length)renderAnimRound(); else startReview()};
  if(ok){
    score+=15;animRoundScore+=15;
    document.getElementById('animScore').textContent=animRoundScore;
    f.className='feedback goodtxt';f.textContent='✨ 抓到了！+15 ⭐';
    for(let i=0;i<6;i++){const s=document.createElement('div');s.className='spark';s.textContent='⭐';s.style.left=(btn.offsetLeft+Math.random()*50)+'px';s.style.top=(btn.offsetTop+Math.random()*30)+'px';document.getElementById('gameArea').appendChild(s)}
    setTimeout(next,850);
  }else{
    wrongWords.push(w);
    f.className='feedback badtxt';f.textContent='差一點！先把答案記住。';
    showWrongModal(w,next);
  }
}
function startReview(){reviewList=shuffle([...new Map(wrongWords.map(w=>[w.en,w])).values()]);ri=0;reviewScore=0;if(reviewList.length===0){finish();return}show('review');renderReview()}
function renderReview(){const w=reviewList[ri];document.getElementById('reviewScore').textContent=reviewScore;document.getElementById('reviewQuestion').textContent=`「${w.zh}」的英文是哪一個？`;let distract=shuffle(words.filter(x=>x.en!==w.en)).slice(0,3).map(x=>x.en),opts=shuffle([w.en,...distract]),c=document.getElementById('reviewChoices');c.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{[...c.children].forEach(x=>x.disabled=true);const ok=o===w.en,f=document.getElementById('reviewFeedback');if(ok){score+=15;reviewScore+=15;f.textContent='🔥 Boss 擊破！+15 ⭐'}else{wrongWords.push(w);f.textContent='這題再記一次！';showWrongModal(w,()=>{ri++;if(ri<reviewList.length)renderReview();else finish()});return}setTimeout(()=>{ri++;if(ri<reviewList.length)renderReview();else finish()},650)};c.appendChild(b)})}
function skipStage(stage){
  if(stage==='quiz'){
    qi=quizQuestions.length;
    startMatch();
    return;
  }
  if(stage==='match'){
    selectedMatch=null;
    startAnimGame();
    return;
  }
  if(stage==='animGame'){
    clearInterval(moveTimer);
    startReview();
    return;
  }
  if(stage==='review'){
    finish();
  }
}
function finish(){show('result');document.getElementById('finalScore').textContent=score;const wrong=[...new Map(wrongWords.map(w=>[w.en,w])).values()];document.getElementById('finalText').textContent=wrong.length?`完成 ${quizQuestions.length} 題挑戰！今天最需要再複習：${wrong.map(w=>w.en).join('、')}`:`太厲害了！第一關全部答對，共完成 ${quizQuestions.length} 題挑戰。`;localStorage.setItem('wordAdventureLastScore',String(score))}show('home');
</script>
<div id="wrongModal" class="modal hidden">
  <div class="modal-box">
    <div style="font-size:54px">💡</div>
    <h3>再記一次！</h3>
    <p id="wrongModalText"></p>
    <div id="wrongModalAnswer" class="modal-answer"></div>
    <button class="btn primary big" onclick="closeWrongModal()">我記住了 ✓</button>
  </div>
</div>
</body></html>
